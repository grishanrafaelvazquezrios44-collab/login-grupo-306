<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
</head>
<body>
    <h1>Bienvenido</h1>
    <form action="{{ url_for('acceder') }}" method="POST">
        <input type="text" name="identificador" placeholder="Usuario o correo" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a href="{{ url_for('registrar') }}">Regístrate</a></p>
</body>
</html>
