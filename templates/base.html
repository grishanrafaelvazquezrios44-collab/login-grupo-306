<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login Grupo 306{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #101827, #263b63);
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: rgba(10, 18, 35, 0.95);
            padding: 18px 25px;
        }

        .navbar-brand {
            color: white;
            font-size: 23px;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: #65d6ff;
        }

        .main-container {
            min-height: 85vh;
            padding: 35px 15px;
        }

        .card {
            border: none;
            border-radius: 18px;
            color: #222;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #cbd5e1;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                LOGIN | GRUPO 306
            </a>
            <span class="text-light">
                Proyecto Flask
            </span>
        </div>
    </nav>

    <main class="main-container">
        <div class="container">

            {% block contenido %}
                {% block content %}{% endblock %}
            {% endblock %}

        </div>
    </main>

    <footer>
        Proyecto Login Flask · Grupo 306
        <br>
        Tercer parcial
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}

</body>
  </html>
