{% extends 'base.html' %}

{% block title %}Iniciar sesión | Grupo 306{% endblock %}

{% block content %}

<div class="row justify-content-center align-items-center">
    <div class="col-md-6 col-lg-5">

        <div class="card p-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold">¡Bienvenido!</h2>
                <p class="text-secondary">Inicia sesión en tu cuenta</p>
            </div>

            <form action="{{ url_for('acceder') }}" method="POST">

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email"
                           name="correo"
                           class="form-control"
                           placeholder="Ingresa tu correo"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Ingresa tu contraseña"
                           required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Iniciar sesión
                </button>

            </form>

            <hr>

            <p class="text-center mb-0">
                ¿No tienes cuenta?
                <a href="{{ url_for('registro') }}">Crear una cuenta</a>
            </p>
        </div>

        <p class="text-center mt-4 text-light">
            Proyecto Flask · Grupo 306
        </p>

    </div>
</div>

{% endblock %}
